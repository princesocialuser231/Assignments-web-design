<!DOCTYPE html>
<html>
<head>
  <title>My Timetable</title>
  <style>
    table {
      width: 80%;
      border-collapse: collapse;
      margin: 20px auto;
    }
    th, td {
      border: 1px solid #333;
      padding: 10px;
      text-align: center;
    }
    thead {
      background-color: #4CAF50;
      color: white;
    }
    tfoot {
      background-color: #f2f2f2;
      font-style: italic;
    }
  </style>
</head>
<body>
  <h1 style="text-align:center;">Weekly Timetable</h1>
  <table>
    <thead>
      <tr>
        <th>Day</th>
        <th>9–10 AM</th>
        <th>10–11 AM</th>
        <th>11–12 PM</th>
        <th>12–1 PM</th>
        <th>2–3 PM</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Monday</td>
        <td>Math</td>
        <td>Physics</td>
        <td>CS103 Lab</td>
        <td>Break</td>
        <td>English</td>
      </tr>
      <tr>
        <td>Tuesday</td>
        <td>Electronics</td>
        <td>Math</td>
        <td>CS101</td>
        <td>Break</td>
        <td>Sports</td>
      </tr>
      <!-- Add more rows for other days -->
    </tbody>
    <tfoot>
      <tr>
        <td colspan="6">*Timetable subject to change</td>
      </tr>
    </tfoot>
  </table>
</body>
</html>
